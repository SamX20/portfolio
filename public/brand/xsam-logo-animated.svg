<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 302 64">
  <style>
    .l{animation:inL .9s cubic-bezier(.22,1,.36,1) both}
    .r{animation:inR .9s cubic-bezier(.22,1,.36,1) both}
    .s{transform-box:fill-box;transform-origin:center;animation:spark .7s .75s cubic-bezier(.34,1.56,.64,1) both, twinkle 1.2s 1.8s ease-in-out}
    .w{animation:word .8s 1s cubic-bezier(.22,1,.36,1) both}
    @keyframes inL{from{transform:translate(-14px,-10px);opacity:0}to{transform:none;opacity:1}}
    @keyframes inR{from{transform:translate(14px,10px);opacity:0}to{transform:none;opacity:1}}
    @keyframes spark{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
    @keyframes twinkle{0%,100%{transform:scale(1)}40%{transform:scale(1.3) rotate(45deg)}}
    @keyframes word{from{transform:translateX(-12px);opacity:0}to{transform:none;opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <polygon class="l" points="6,8 25,25 6,42" fill="#F5F5F4" stroke="#F5F5F4" stroke-width="5" stroke-linejoin="round"/>
  <polygon class="r" points="58,22 39,39 58,56" fill="#F5F5F4" stroke="#F5F5F4" stroke-width="5" stroke-linejoin="round"/>
  <path class="s" d="M32 23C32.7 29.12 34.25 31.1 39.02 32 34.25 32.9 32.7 34.88 32 41 31.3 34.88 29.75 32.9 24.98 32 29.75 31.1 31.3 29.12 32 23Z" fill="#8EA2FF"/>
  <text class="w" x="84" y="44" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" letter-spacing="-1.2" fill="#F5F5F4">XSam <tspan font-weight="400" fill="#8A8A8A">Studio</tspan></text>
</svg>
